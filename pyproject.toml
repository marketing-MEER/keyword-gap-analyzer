[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "keyword-gap-analyzer"
version = "1.0.0"
description = "Missing, weak, shared and untapped keywords vs competitors, scored by revenue potential"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "keyword", "gap", "analyzer"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/keyword-gap-analyzer"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
keyword-gap-analyzer = "keyword_gap_analyzer.cli:main"

[tool.setuptools]
packages = ["keyword_gap_analyzer"]
